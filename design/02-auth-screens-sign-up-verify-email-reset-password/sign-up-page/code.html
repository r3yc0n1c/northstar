<!DOCTYPE html><html class="h-full bg-[#121019]" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Create Account | Northstar OS</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" class="">
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#121019',
            surface: '#1E1B2E',
            borderPrimary: '#40375C',
            accentViolet: '#9D8DF1',
            accentBase: '#5A4F7C',
            textPrimary: '#ECEBF6',
            textSecondary: '#8C829E',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
<!-- Custom styles for fine form styling -->
<style data-purpose="custom-inputs">
    .form-input-custom {
      background-color: #171424;
      border: 1px solid #40375C;
      color: #ECEBF6;
      transition: all 0.15s ease-in-out;
    }
    .form-input-custom:focus {
      border-color: #9D8DF1;
      box-shadow: 0 0 0 1px #9D8DF1;
      background-color: #1a1729;
      outline: none;
    }
    .form-input-custom::placeholder {
      color: #554D69;
    }

<body class="h-full font-sans text-textPrimary antialiased selection:bg-accentViolet selection:text-obsidian">
<!-- BEGIN: SignupContainer -->
<main class="min-h-screen w-full flex flex-col lg:flex-row bg-obsidian">
<!-- BEGIN: LeftFormSection -->
<section class="w-full lg:w-1/2 flex flex-col justify-between p-6 sm:p-10 lg:p-12 xl:p-14 min-h-screen" data-purpose="auth-form-column">
<!-- Top Brand Header -->
<header class="flex items-center justify-between" data-purpose="brand-header">
<a class="inline-flex items-center gap-3 group focus:outline-none focus:ring-1 focus:ring-accentViolet rounded p-1" href="#">
<!-- Geometric Northstar Logo Mark -->
<div class="w-8 h-8 rounded-lg bg-surface border border-borderPrimary flex items-center justify-center transition-colors group-hover:border-accentViolet shadow-sm">
<svg class="w-4 h-4 text-accentViolet" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
</svg>
</div>
<div class="flex items-baseline gap-2">
<span class="font-semibold tracking-tight text-textPrimary text-base">Northstar</span>
<span class="font-mono text-xs uppercase tracking-widest text-textSecondary font-medium">OS v2.4</span>
</div>
</a>
</header>
<!-- Center Auth Form Box -->
<div class="w-full max-w-[420px] mx-auto py-8 lg:py-4" data-purpose="auth-form-content"><!-- Title & Subtitle -->
<div class="mb-6">
  <h1 class="text-2xl sm:text-[28px] font-semibold text-textPrimary tracking-tight">Create your account</h1>
  <p class="text-sm text-textSecondary mt-1 font-normal">Plan what matters. Do what's next.</p>
</div>

<!-- Google OAuth Button -->
<button type="button" class="w-full h-10 px-4 rounded-md bg-[#1c1a24] border border-[#40375C] hover:bg-[#25213b] text-textPrimary font-sans text-sm font-medium flex items-center justify-center gap-3 transition-colors duration-150 shadow-sm">
  <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
    <path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.03h3.88c2.27-2.09 3.665-5.17 3.665-9.12z" fill="#4285F4"></path>
    <path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.03c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.94H1.26v3.13C3.25 21.31 7.31 24 12 24z" fill="#34A853"></path>

  </svg>
  <span class="">Continue with Google</span>
</button>

<div class="relative my-6 flex items-center justify-center">
  <div class="absolute inset-0 flex items-center">
    <div class="w-full border-t border-[#40375C]"></div>
  </div>
  <span class="relative px-3 bg-obsidian font-mono text-[11px] text-textSecondary uppercase tracking-wider">or</span>
</div>

<!-- Form Elements -->
<form method="POST" action="#" class="space-y-4" onsubmit="event.preventDefault();">
  <!-- Email Field -->
  <div class="space-y-1.5">
    <label for="email" class="block text-xs font-medium text-textSecondary tracking-wide">Email</label>
    <input id="email" name="email" type="email" value="elena.vance@northstar.io" placeholder="you@example.com" required="" class="w-full h-10 px-3 bg-[#0f0d16] border border-[#40375C] rounded-md text-textPrimary text-sm font-sans placeholder:text-[#554D69] focus:outline-none focus:border-accentViolet focus:ring-1 focus:ring-accentViolet transition-colors">
  </div>

  <!-- Password Field -->
  <div class="space-y-1.5">
    <label for="password" class="block text-xs font-medium text-textSecondary tracking-wide">Password</label>
    <div class="relative">
      <input id="password" name="password" type="password" value="Kestrel#2025_Obsidian" required="" class="w-full h-10 pl-3 pr-10 bg-[#0f0d16] border border-[#40375C] rounded-md text-textPrimary text-sm font-mono tracking-widest placeholder:text-[#554D69] focus:outline-none focus:border-accentViolet focus:ring-1 focus:ring-accentViolet transition-colors">
      <button type="button" aria-label="Toggle password visibility" onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password';" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-textSecondary hover:text-textPrimary p-1 focus:outline-none transition-colors">
        <span class="material-symbols-outlined text-[18px]">visibility</span>
      </button>
    </div>
    <!-- 4-segment Strength Indicator -->
    <div class="mt-2 space-y-1.5">
      <div class="grid grid-cols-4 gap-1.5">
        <div class="h-[3px] rounded-full bg-accentViolet"></div>
        <div class="h-[3px] rounded-full bg-accentViolet"></div>
        <div class="h-[3px] rounded-full bg-accentViolet"></div>
        <div class="h-[3px] rounded-full bg-[#40375C]"></div>
      </div>
      <div class="flex items-center justify-between text-textSecondary">
        <span class="text-xs text-textSecondary">At least 10 characters</span>
        <span class="font-mono text-[11px] text-accentViolet font-medium">STRONG (3/4)</span>
      </div>
    </div>
  </div>

  <!-- Confirm Password Field -->
  <div class="space-y-1.5">
    <label for="confirmPassword" class="block text-xs font-medium text-textSecondary tracking-wide">Confirm password</label>
    <div class="relative">
      <input id="confirmPassword" name="confirmPassword" type="password" value="Kestrel#2025_Obsidian" required="" class="w-full h-10 pl-3 pr-10 bg-[#0f0d16] border border-[#40375C] rounded-md text-textPrimary text-sm font-mono tracking-widest placeholder:text-[#554D69] focus:outline-none focus:border-accentViolet focus:ring-1 focus:ring-accentViolet transition-colors">
      <button type="button" aria-label="Toggle confirm password visibility" onclick="const p = document.getElementById('confirmPassword'); p.type = p.type === 'password' ? 'text' : 'password';" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-textSecondary hover:text-textPrimary p-1 focus:outline-none transition-colors">
        <span class="material-symbols-outlined text-[18px]">visibility</span>
      </button>
    </div>
  </div>

  <!-- Primary Submit Button -->
  <div class="pt-2">
    <button type="submit" class="w-full h-10 px-4 rounded-md bg-[#5a4f7c] hover:bg-[#635885] text-textPrimary font-medium text-sm flex items-center justify-center gap-2 transition-colors border border-transparent shadow-sm focus:outline-none focus:ring-2 focus:ring-accentViolet focus:ring-offset-2 focus:ring-offset-obsidian active:scale-[0.99]">
      <span class="">Create account</span>
      <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
    </button>
  </div>
</form>

<!-- Footer Sign-in Link -->
<div class="mt-6 text-center">
  <p class="text-sm text-textSecondary">
    Already have an account? 
    <a href="#" class="text-accentViolet hover:text-[#c9beff] transition-colors underline-offset-4 hover:underline font-medium">Sign in</a>
  </p>
</div></div>

<footer class="text-[11px] text-[#554D69] flex justify-between items-center" data-purpose="column-footer">
<span class="font-mono">SYS.STATUS: OPERATIONAL</span>
<span class="">Secure Telemetry Auth</span>
